<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1500" viewBox="0 0 3600 1500" role="img" aria-labelledby="title desc">
  <title id="title">OOP Cold Chain UML Class Diagram</title>
  <desc id="desc">Class-only UML diagram showing project classes, attributes, methods, inheritance, and key compositions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#fff" stroke="#2563eb" stroke-width="1.5"/></marker>
    <marker id="diamond" viewBox="0 0 14 12" refX="1" refY="6" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M1 6 L7 1 L13 6 L7 11 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17243a}.title{font-size:46px;font-weight:700}.subtitle{font-size:20px;fill:#56657a}
      .pkg{fill:#f8fbff;stroke:#2563eb;stroke-width:3}.pkghead{fill:#e8f1ff}.pkgtitle{font-size:25px;font-weight:700;fill:#17439b}
      .cls{fill:#fff;stroke:#3478d4;stroke-width:2}.clshead{fill:#edf5ff}.name{font-size:18px;font-weight:700;fill:#153e83}.stereo{font-size:13px;font-weight:600;fill:#526d92}.attr,.meth{font-size:14px;fill:#26364f}.divider{stroke:#a8c0e4;stroke-width:1.4}
      .assoc{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow)}.impl{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#triangle)}.comp{fill:none;stroke:#2563eb;stroke-width:2.4;marker-start:url(#diamond);marker-end:url(#arrow)}
      .lab{font-size:13px;font-weight:600;fill:#315a91}
    </style>
  </defs>
  <rect width="3600" height="1900" fill="#fff"/>
  <text class="title" x="65" y="72">OOP COLD CHAIN — UML CLASS DIAGRAM</text>
  <text class="subtitle" x="68" y="110">Classes, attributes, methods, inheritance, and key object relationships</text>

  <!-- Domain classes -->
  <rect class="pkg" x="55" y="150" width="1360" height="1300" rx="14"/>
  <path class="pkghead" d="M69 150 H1401 Q1415 150 1415 164 V204 H55 V164 Q55 150 69 150Z"/>
  <text class="pkgtitle" x="82" y="184">Domain Model</text>
  <g transform="translate(80 235)"><rect class="cls" width="390" height="155" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">Temperature</text><text class="stereo" x="14" y="41">&lt;&lt;value object&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- value: double</text><text class="attr" x="14" y="98">- unit: string</text><line class="divider" y1="110" x2="390" y2="110"/><text class="meth" x="14" y="137">+ getValue()  + getUnit()</text></g>
  <g transform="translate(520 235)"><rect class="cls" width="390" height="155" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">GPSLocation</text><text class="stereo" x="14" y="41">&lt;&lt;value object&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- latitude: double</text><text class="attr" x="14" y="98">- longitude: double</text><line class="divider" y1="110" x2="390" y2="110"/><text class="meth" x="14" y="137">+ getLat()  + getLon()</text></g>
  <g transform="translate(960 235)"><rect class="cls" width="390" height="155" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">TemperatureRange</text><text class="stereo" x="14" y="41">&lt;&lt;value object&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- minTemp: double</text><text class="attr" x="14" y="98">- maxTemp: double</text><line class="divider" y1="110" x2="390" y2="110"/><text class="meth" x="14" y="137">+ isViolated(temp): bool</text></g>
  <g transform="translate(80 430)"><rect class="cls" width="390" height="180" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">SensorReading</text><text class="stereo" x="14" y="41">&lt;&lt;value object&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- temp: Temperature</text><text class="attr" x="14" y="98">- location: GPSLocation</text><text class="attr" x="14" y="120">- humidity: double</text><text class="attr" x="14" y="142">- timestamp: string</text><line class="divider" y1="153" x2="390" y2="153"/><text class="meth" x="14" y="173">+ getters()</text></g>
  <g transform="translate(520 430)"><rect class="cls" width="390" height="180" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">TemperatureExceededEvent</text><text class="stereo" x="14" y="41">&lt;&lt;domain event&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- shipmentId: string</text><text class="attr" x="14" y="98">- sensorId: string</text><text class="attr" x="14" y="120">- recordedTemp: double</text><text class="attr" x="14" y="142">- timestamp: string</text><line class="divider" y1="153" x2="390" y2="153"/><text class="meth" x="14" y="173">+ getters()</text></g>
  <g transform="translate(960 430)"><rect class="cls" width="390" height="180" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">Driver</text><text class="stereo" x="14" y="41">&lt;&lt;entity&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- driverId: string</text><text class="attr" x="14" y="98">- fullName: string</text><text class="attr" x="14" y="120">- phoneNumber: string</text><line class="divider" y1="132" x2="390" y2="132"/><text class="meth" x="14" y="161">+ getId()  + getName()</text></g>
  <g transform="translate(80 650)"><rect class="cls" width="390" height="170" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">Sensor</text><text class="stereo" x="14" y="41">&lt;&lt;entity&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- sensorId: string</text><text class="attr" x="14" y="98">- currentTemp: Temperature</text><line class="divider" y1="110" x2="390" y2="110"/><text class="meth" x="14" y="138">+ getId()  + getTemp()</text><text class="meth" x="14" y="160">+ updateTemp(temp)</text></g>
  <g transform="translate(520 650)"><rect class="cls" width="390" height="170" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">Container</text><text class="stereo" x="14" y="41">&lt;&lt;entity&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- containerId: string</text><text class="attr" x="14" y="98">- containerType: string</text><text class="attr" x="14" y="120">- allowedRange: TemperatureRange</text><line class="divider" y1="132" x2="390" y2="132"/><text class="meth" x="14" y="160">+ isSuitableFor(temp): bool</text></g>
  <g transform="translate(960 650)"><rect class="cls" width="390" height="170" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="14" y="22">ColdWarehouse</text><text class="stereo" x="14" y="41">&lt;&lt;entity&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="14" y="76">- warehouseId: string</text><text class="attr" x="14" y="98">- name: string</text><text class="attr" x="14" y="120">- location: GPSLocation</text><line class="divider" y1="132" x2="390" y2="132"/><text class="meth" x="14" y="160">+ getId()  + getLocation()</text></g>
  <g transform="translate(300 900)"><rect class="cls" width="540" height="230" rx="7"/><rect class="clshead" width="540" height="48" rx="7"/><text class="name" x="14" y="22">Shipment</text><text class="stereo" x="14" y="41">&lt;&lt;aggregate root&gt;&gt;</text><line class="divider" y1="48" x2="540" y2="48"/><text class="attr" x="14" y="76">- shipmentId: string</text><text class="attr" x="14" y="98">- container: Container</text><text class="attr" x="14" y="120">- sensors: vector&lt;Sensor&gt;</text><text class="attr" x="14" y="142">- isCompromised: bool</text><text class="attr" x="14" y="164">- domainEvents: vector&lt;TemperatureExceededEvent&gt;</text><line class="divider" y1="176" x2="540" y2="176"/><text class="meth" x="14" y="203">+ addSensor()  + hasSensor()</text><text class="meth" x="14" y="224">+ recordTemperature()  + clearDomainEvents()</text></g>
  <g transform="translate(850 1200)"><rect class="cls" width="490" height="170" rx="7"/><rect class="clshead" width="490" height="48" rx="7"/><text class="name" x="14" y="22">IShipmentRepository</text><text class="stereo" x="14" y="41">&lt;&lt;interface&gt;&gt;</text><line class="divider" y1="48" x2="490" y2="48"/><line class="divider" y1="64" x2="490" y2="64"/><text class="meth" x="14" y="96">+ save(shipment): void</text><text class="meth" x="14" y="124">+ findById(id): unique_ptr&lt;Shipment&gt;</text></g>
  <path class="comp" d="M430 900 V865 H275 V820"/><text class="lab" x="285" y="855">0..* sensors</text>
  <path class="comp" d="M710 900 V865 H715 V820"/><text class="lab" x="722" y="855">1 container</text>

  <!-- Backend classes -->
  <rect class="pkg" x="1450" y="150" width="1300" height="1300" rx="14"/>
  <path class="pkghead" d="M1464 150 H2736 Q2750 150 2750 164 V204 H1450 V164 Q1450 150 1464 150Z"/>
  <text class="pkgtitle" x="1477" y="184">Backend</text>
  <g transform="translate(1490 235)"><rect class="cls" width="540" height="190" rx="7"/><rect class="clshead" width="540" height="48" rx="7"/><text class="name" x="14" y="22">TelemetryData</text><text class="stereo" x="14" y="41">&lt;&lt;struct&gt;&gt;</text><line class="divider" y1="48" x2="540" y2="48"/><text class="attr" x="14" y="76">+ deviceId, shipmentId: string</text><text class="attr" x="14" y="98">+ temperature, humidity: double</text><text class="attr" x="14" y="120">+ latitude, longitude: double</text><text class="attr" x="14" y="142">+ timestamp, status: string</text></g>
  <g transform="translate(2090 235)"><rect class="cls" width="620" height="215" rx="7"/><rect class="clshead" width="620" height="48" rx="7"/><text class="name" x="14" y="22">ShipmentApplicationService</text><text class="stereo" x="14" y="41">&lt;&lt;application service&gt;&gt;</text><line class="divider" y1="48" x2="620" y2="48"/><text class="attr" x="14" y="76">- repo: IShipmentRepository&amp;</text><text class="attr" x="14" y="98">- publisher: SensorDataPublisher&amp;</text><text class="attr" x="14" y="120">- connStr: string</text><line class="divider" y1="132" x2="620" y2="132"/><text class="meth" x="14" y="161">+ createShipment()  + processSensorData()</text><text class="meth" x="14" y="189">+ getShipmentTelemetry()  + getShipments()</text></g>
  <g transform="translate(1490 510)"><rect class="cls" width="540" height="180" rx="7"/><rect class="clshead" width="540" height="48" rx="7"/><text class="name" x="14" y="22">SensorDataPublisher</text><text class="stereo" x="14" y="41">&lt;&lt;publisher&gt;&gt;</text><line class="divider" y1="48" x2="540" y2="48"/><text class="attr" x="14" y="78">- observers: vector&lt;shared_ptr&lt;ISensorObserver&gt;&gt;</text><line class="divider" y1="98" x2="540" y2="98"/><text class="meth" x="14" y="128">+ subscribe(observer)</text><text class="meth" x="14" y="156">+ publish(data: TelemetryData)</text></g>
  <g transform="translate(2090 510)"><rect class="cls" width="620" height="160" rx="7"/><rect class="clshead" width="620" height="48" rx="7"/><text class="name" x="14" y="22">ISensorObserver</text><text class="stereo" x="14" y="41">&lt;&lt;interface&gt;&gt;</text><line class="divider" y1="48" x2="620" y2="48"/><line class="divider" y1="64" x2="620" y2="64"/><text class="meth" x="14" y="96">+ onSensorData(data): void</text><text class="meth" x="14" y="124">+ name(): string</text></g>
  <g transform="translate(1490 770)"><rect class="cls" width="380" height="190" rx="7"/><rect class="clshead" width="380" height="48" rx="7"/><text class="name" x="12" y="22">TemperatureAlertHandler</text><text class="stereo" x="12" y="41">&lt;&lt;observer&gt;&gt;</text><line class="divider" y1="48" x2="380" y2="48"/><text class="attr" x="12" y="78">- repo: IShipmentRepository&amp;</text><text class="attr" x="12" y="100">- connStr: string</text><line class="divider" y1="112" x2="380" y2="112"/><text class="meth" x="12" y="142">+ onSensorData(data)</text><text class="meth" x="12" y="168">+ name()</text></g>
  <g transform="translate(1905 770)"><rect class="cls" width="380" height="190" rx="7"/><rect class="clshead" width="380" height="48" rx="7"/><text class="name" x="12" y="22">TelemetryLogger</text><text class="stereo" x="12" y="41">&lt;&lt;observer&gt;&gt;</text><line class="divider" y1="48" x2="380" y2="48"/><text class="attr" x="12" y="78">- connStr: string</text><line class="divider" y1="96" x2="380" y2="96"/><text class="meth" x="12" y="128">+ onSensorData(data)</text><text class="meth" x="12" y="156">+ name()</text></g>
  <g transform="translate(2320 770)"><rect class="cls" width="390" height="190" rx="7"/><rect class="clshead" width="390" height="48" rx="7"/><text class="name" x="12" y="22">QualityEvaluator</text><text class="stereo" x="12" y="41">&lt;&lt;observer&gt;&gt;</text><line class="divider" y1="48" x2="390" y2="48"/><text class="attr" x="12" y="78">- repo: IShipmentRepository&amp;</text><line class="divider" y1="96" x2="390" y2="96"/><text class="meth" x="12" y="128">+ onSensorData(data)</text><text class="meth" x="12" y="156">+ name()</text></g>
  <g transform="translate(1830 1080)"><rect class="cls" width="680" height="215" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">PostgresShipmentRepository</text><text class="stereo" x="14" y="41">&lt;&lt;repository implementation&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><text class="attr" x="14" y="78">- conn_str: string</text><line class="divider" y1="94" x2="680" y2="94"/><text class="meth" x="14" y="126">+ save(shipment): void</text><text class="meth" x="14" y="154">+ findById(id): unique_ptr&lt;Shipment&gt;</text></g>
  <path class="assoc" d="M2030 600 H2090"/>
  <path class="impl" d="M1680 770 V730 H2140 V670"/><path class="impl" d="M2095 770 V670"/><path class="impl" d="M2515 770 V730 H2650 V670"/>
  <path class="impl" d="M1830 1185 H1340"/>

  <!-- Simulator classes -->
  <rect class="pkg" x="2785" y="150" width="760" height="1300" rx="14"/>
  <path class="pkghead" d="M2799 150 H3531 Q3545 150 3545 164 V204 H2785 V164 Q2785 150 2799 150Z"/>
  <text class="pkgtitle" x="2812" y="184">Simulator</text>
  <g transform="translate(2825 235)"><rect class="cls" width="680" height="150" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">Waypoint</text><text class="stereo" x="14" y="41">&lt;&lt;struct&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><text class="attr" x="14" y="78">+ lat: double</text><text class="attr" x="14" y="104">+ lon: double</text></g>
  <g transform="translate(2825 445)"><rect class="cls" width="680" height="185" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">RouteOptimizer</text><text class="stereo" x="14" y="41">&lt;&lt;utility&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><line class="divider" y1="64" x2="680" y2="64"/><text class="meth" x="14" y="96">+ buildRoute(origin, destination): vector&lt;Waypoint&gt;</text><text class="meth" x="14" y="124">- lookup(city, fallback): Waypoint</text><text class="meth" x="14" y="152">- weightedLength(a, mid, b): double</text></g>
  <g transform="translate(2825 690)"><rect class="cls" width="680" height="255" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">IoTHardwareEngine</text><text class="stereo" x="14" y="41">&lt;&lt;simulator&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><text class="attr" x="14" y="78">- route: vector&lt;Waypoint&gt;</text><text class="attr" x="14" y="100">- leg, legProgress, kmPerTick</text><text class="attr" x="14" y="122">- currentTemp, currentHum, lat, lon</text><line class="divider" y1="136" x2="680" y2="136"/><text class="meth" x="14" y="166">+ advanceState(): void</text><text class="meth" x="14" y="192">+ hasArrived(): bool</text><text class="meth" x="14" y="218">+ getTemp()  + getHum()  + getLat()  + getLon()</text></g>
  <g transform="translate(2825 1005)"><rect class="cls" width="680" height="170" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">HttpClient</text><text class="stereo" x="14" y="41">&lt;&lt;utility&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><line class="divider" y1="64" x2="680" y2="64"/><text class="meth" x="14" y="98">+ sendPostRequest(url, jsonPayload): void</text><text class="meth" x="14" y="128">Uses libcurl</text></g>
  <g transform="translate(2825 1235)"><rect class="cls" width="680" height="165" rx="7"/><rect class="clshead" width="680" height="48" rx="7"/><text class="name" x="14" y="22">TrackingContext</text><text class="stereo" x="14" y="41">&lt;&lt;struct&gt;&gt;</text><line class="divider" y1="48" x2="680" y2="48"/><text class="attr" x="14" y="80">+ shipment: Shipment</text><text class="attr" x="14" y="106">+ sensorId: string</text></g>
  <path class="assoc" d="M3165 445 V385"/><path class="assoc" d="M3165 690 V630"/>
